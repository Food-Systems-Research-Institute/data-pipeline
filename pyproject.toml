[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/collect_usda", "src/utils.py"]
sources = ["src"]

[project]
name = "data-pipeline"
version = "0.1.0"
description = "USDA NASS agricultural data collection pipeline into DuckDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pytest>=9.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]
license = "MIT"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]
